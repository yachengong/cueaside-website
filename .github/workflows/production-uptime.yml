name: Production uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: false

jobs:
  smoke:
    if: github.repository == 'yachengong/cueaside-website'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CUEASIDE_PRODUCTION_URL: https://cueaside.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check production availability and access boundaries
        run: node scripts/production-smoke.mjs
